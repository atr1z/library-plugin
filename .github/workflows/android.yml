name: Plugin release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Publish to Gradle Plugin Portal
        env:
          KEY=${{secrets.KEY}}
          SECRET=${{secrets.SECRET}}
          SIGNING_KEY=${{secrets.SIGNING_KEY}}
          SIGNING_PASSWORD=${{secrets.SIGNING_PASSWORD}}
        run: ./gradlew publishPlugins -Pgradle.publish.key=$KEY -Pgradle.publish.secret=$SECRET -Pgradle.publish.signing.key=$KEY -Pgradle.publish.signing.password=$SECRET